# Все пути — относительно этой папки (frontend-madrigal/edinoros/).
# Репо клонируются соседними папками: ../../backend-madrigal и эта (фронт).

services:
  backend:
    build: ../../backend-madrigal
    ports:
      - "8080:8080"
    volumes:
      # :Z — на Fedora/RHEL контейнер (container_t) без метки не может писать
      # в user_home_t/tmp_t; без него данные проекта не сохраняются на диск.
      - ../../backend-madrigal/data:/app/data:Z
      - ../../backend-madrigal/uploads:/app/uploads:Z
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - backend
    restart: unless-stopped

  # Только для сборки Linux-инсталлятора Tauri через Linux-контейнер.
  # Не стартует при обычном `docker compose up`.
  tauri-build:
    profiles: ["tauri-build"]
    build:
      context: .
      dockerfile: Dockerfile.tauri-build
    # label=disable: контейнеру не нужен SELinux-релейбл хостовых mount'ов.
    # С ':z' podman переразмечал весь репозиторий в container_file_t — после этого
    # dnf/rpm не могли читать собранные .rpm/.deb (см. README, «Если что-то не так»).
    security_opt:
      - label=disable
    volumes:
      - ../../backend-madrigal:/workspace/backend
      - .:/workspace/frontend
      - cargo-cache:/root/.cargo
      - node-cache:/workspace/frontend/node_modules
    working_dir: /workspace/frontend
    command: bash /workspace/frontend/build-tauri.sh

volumes:
  cargo-cache:
  node-cache:
